<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Agent UX primitives">
  <rect width="1000" height="560" fill="#fbfbfd"/>
  <text x="56" y="66" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#192033">CopilotKit 做的是 Agent 的前端体验</text>
  <text x="56" y="104" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#5e6879">不是单独的模型服务，而是把 Agent 能力放进真实产品界面。</text>
  <g transform="translate(72 154)">
    <rect width="190" height="120" rx="16" fill="#eef1ff" stroke="#cbd2ff"/>
    <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25305d">Chat UI</text>
    <text x="24" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536072">流式回复和工具调用</text>
  </g>
  <g transform="translate(294 154)">
    <rect width="190" height="120" rx="16" fill="#edf8f4" stroke="#c8eadb"/>
    <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#174837">Shared State</text>
    <text x="24" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#536b60">Agent 与页面同读同写</text>
  </g>
  <g transform="translate(516 154)">
    <rect width="190" height="120" rx="16" fill="#fff3e6" stroke="#f5d2a8"/>
    <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#5b3510">Generative UI</text>
    <text x="24" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#705334">动态渲染组件</text>
  </g>
  <g transform="translate(738 154)">
    <rect width="190" height="120" rx="16" fill="#f7edf8" stroke="#e3c7e9"/>
    <text x="24" y="48" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#55275e">HITL</text>
    <text x="24" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#6a4d70">需要用户确认再继续</text>
  </g>
  <rect x="98" y="354" width="804" height="84" rx="18" fill="#1e2432"/>
  <text x="138" y="407" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff">产品用户看到的是界面，Agent 看到的是状态、工具和下一步动作。</text>
</svg>
