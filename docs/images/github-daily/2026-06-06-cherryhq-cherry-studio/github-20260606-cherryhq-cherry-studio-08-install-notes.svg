<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f8f9fb"/><rect x="94" y="80" width="1012" height="515" rx="26" fill="#fff" stroke="#dde3ea"/><text x="135" y="150" font-size="48" font-family="Arial" font-weight="700" fill="#1f2933">上手路径很直接</text><text x="135" y="205" font-size="29" font-family="Arial" fill="#52606d">下载客户端，配置模型，再按需要打开知识库、MCP 和 Agent</text><text x="150" y="310" font-size="34" font-family="Arial" font-weight="700" fill="#1f2933">1. 下载：Release / 官网</text><text x="150" y="375" font-size="34" font-family="Arial" font-weight="700" fill="#1f2933">2. 模型：API Key / 本地模型</text><text x="150" y="440" font-size="34" font-family="Arial" font-weight="700" fill="#1f2933">3. 资料：文件 / URL / sitemap</text><text x="150" y="505" font-size="34" font-family="Arial" font-weight="700" fill="#1f2933">4. 工具：MCP / Agent 先小范围试</text><text x="135" y="565" font-size="26" font-family="Arial" fill="#52606d">注意 AGPL-3.0、模型账单、API key 和本地文件权限。</text></svg>
