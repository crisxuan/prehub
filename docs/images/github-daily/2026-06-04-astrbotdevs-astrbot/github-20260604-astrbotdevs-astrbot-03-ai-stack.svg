<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AstrBot AI stack</title>
  <desc id="desc">AstrBot supports LLM conversations, multimodal input, Agent, MCP, skills, knowledge base and persona settings.</desc>
  <rect width="1200" height="630" fill="#eef2ff"/>
  <text x="70" y="86" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">AI 能力不是只接一个模型</text>
  <text x="70" y="128" fill="#4b5563" font-family="Inter, Arial, sans-serif" font-size="24">README 明确列出：大模型对话、多模态、Agent、MCP、Skills、知识库、人格设定、上下文压缩。</text>
  <g font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">
    <rect x="82" y="194" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="116" y="250" fill="#111827">LLM 对话</text>
    <rect x="424" y="194" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="458" y="250" fill="#111827">多模态输入</text>
    <rect x="766" y="194" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="800" y="250" fill="#111827">Agent 执行</text>
    <rect x="82" y="330" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="116" y="386" fill="#111827">MCP / Skills</text>
    <rect x="424" y="330" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="458" y="386" fill="#111827">知识库</text>
    <rect x="766" y="330" width="300" height="92" rx="14" fill="#ffffff"/>
    <text x="800" y="386" fill="#111827">人格设定</text>
  </g>
  <rect x="82" y="500" width="984" height="62" rx="12" fill="#312e81"/>
  <text x="118" y="540" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="24">可接 OpenAI、Anthropic、Gemini、DeepSeek、Ollama、LM Studio，也能接 Dify、Coze、阿里云百炼。</text>
</svg>
