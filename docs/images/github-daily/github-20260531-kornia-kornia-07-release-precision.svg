  <text x="74" y="136" font-family="Arial, sans-serif" font-size="20" fill="#475569">最新 release 不只是加 API，也在补训练和部署细节</text>
  <rect x="88" y="205" width="472" height="285" rx="24" fill="#ffffff" stroke="#bfdbfe"/>
  <rect x="640" y="205" width="472" height="285" rx="24" fill="#ffffff" stroke="#fed7aa"/>
  <g font-family="Arial, sans-serif">
    <text x="126" y="265" font-size="28" font-weight="700" fill="#1d4ed8">新能力</text>
    <text x="126" y="315" font-size="21" fill="#334155">XFeat / ALIKED</text>
