<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">OpenHands product shape</title>
  <desc id="desc">OpenHands includes SDK, CLI, local GUI, cloud, and enterprise options.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <text x="70" y="100" fill="#172554" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="700">README 里看到的项目形态</text>
  <text x="72" y="147" fill="#475569" font-family="Inter, Arial, sans-serif" font-size="24">它不是单一聊天界面，而是一套 AI 软件开发代理入口。</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="74" y="206" width="200" height="250" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="104" y="268" fill="#0f172a" font-size="32" font-weight="700">SDK</text>
    <text x="104" y="318" fill="#334155" font-size="22">把 agent</text>
    <text x="104" y="350" fill="#334155" font-size="22">嵌进自己的</text>
    <text x="104" y="382" fill="#334155" font-size="22">应用和流程</text>
    <rect x="294" y="206" width="200" height="250" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
    <text x="324" y="268" fill="#0f172a" font-size="32" font-weight="700">CLI</text>
    <text x="324" y="318" fill="#334155" font-size="22">像终端里的</text>
    <text x="324" y="350" fill="#334155" font-size="22">Claude Code</text>
    <text x="324" y="382" fill="#334155" font-size="22">或 Codex</text>
    <rect x="514" y="206" width="200" height="250" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="544" y="268" fill="#0f172a" font-size="32" font-weight="700">Local GUI</text>
    <text x="544" y="318" fill="#334155" font-size="22">本机运行</text>
    <text x="544" y="350" fill="#334155" font-size="22">REST API</text>
    <text x="544" y="382" fill="#334155" font-size="22">和 React UI</text>
    <rect x="734" y="206" width="200" height="250" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text x="764" y="268" fill="#0f172a" font-size="32" font-weight="700">Cloud</text>
    <text x="764" y="318" fill="#334155" font-size="22">用 GitHub</text>
    <text x="764" y="350" fill="#334155" font-size="22">或 GitLab</text>
    <text x="764" y="382" fill="#334155" font-size="22">账号试用</text>
    <rect x="954" y="206" width="172" height="250" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="3"/>
    <text x="984" y="268" fill="#0f172a" font-size="32" font-weight="700">Enterprise</text>
    <text x="984" y="318" fill="#334155" font-size="22">私有部署</text>
    <text x="984" y="350" fill="#334155" font-size="22">权限和协作</text>
  </g>
  <text x="74" y="535" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="23">官方 README 还提到：core openhands 和 agent-server Docker images 是 MIT；enterprise 目录另有许可。</text>
</svg>
