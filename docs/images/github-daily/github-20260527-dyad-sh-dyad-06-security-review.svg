  <rect x="132" y="272" width="350" height="48" rx="10" fill="#fee2e2"/>
  <text x="158" y="303" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#991b1b">Critical: SQL injection</text>
  <rect x="132" y="340" width="350" height="48" rx="10" fill="#ffedd5"/>
  <text x="158" y="371" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#9a3412">High: auth misconfig</text>
  <rect x="132" y="408" width="350" height="48" rx="10" fill="#fef9c3"/>
  <text x="158" y="439" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#854d0e">Medium: weak rule</text>
  <rect x="640" y="174" width="468" height="380" rx="24" fill="#ffffff" stroke="#fed7aa"/>
  <text x="680" y="228" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#111827">Review loop</text>
  <circle cx="724" cy="300" r="26" fill="#fb923c"/>
