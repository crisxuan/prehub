<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#fff7ed"/>
  <text x="70" y="82" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#111827">Security review 不是银弹</text>
  <text x="70" y="122" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#4b5563">Dyad 文档明确说这是实验功能，需要和其他安全检查一起用。</text>
  <rect x="92" y="174" width="468" height="380" rx="24" fill="#ffffff" stroke="#fed7aa"/>
