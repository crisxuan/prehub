<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Observability in own database</title>
  <desc id="desc">Agno observability stores traces, spans and audit logs in the user's own database.</desc>
  <rect width="1280" height="720" fill="#f4f7fb"/>
  <text x="80" y="100" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">Trace 不一定要送到外部 SaaS</text>
  <text x="82" y="148" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#475569">AgentOS tracing 默认把运行细节写进你自己的数据库</text>
  <g transform="translate(100 230)">
    <rect width="500" height="330" rx="26" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="36" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#111827">一个 run 里能看到</text>
    <text x="36" y="122" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">LLM call</text>
    <text x="36" y="166" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">tool call</text>
    <text x="36" y="210" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">hook</text>
    <text x="36" y="254" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">retrieval</text>
    <text x="36" y="298" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#334155">team delegation</text>
  </g>
  <g transform="translate(680 230)">
    <rect width="500" height="330" rx="26" fill="#111827"/>
    <text x="36" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">写在哪里</text>
    <text x="36" y="126" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e5e7eb">agno_traces</text>
    <text x="36" y="174" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e5e7eb">agno_spans</text>
    <text x="36" y="222" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e5e7eb">可拆到独立 tracing DB</text>
    <text x="36" y="270" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#e5e7eb">也能导出到 OpenTelemetry</text>
  </g>
  <text x="100" y="636" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#475569">这对 prompt、工具参数、用户数据都比较敏感的 agent 场景很关键。</text>
</svg>
