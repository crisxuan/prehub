<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Agno project overview</title>
  <desc id="desc">Overview card for Agno, an SDK and runtime for building agent platforms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="72" y="62" width="1136" height="596" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="104" y="96" width="210" height="64" rx="18" fill="#101828"/>
  <text x="132" y="138" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#ffffff">Agno</text>
  <text x="104" y="224" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" fill="#111827">把 Agent 做成可运行、可管理的平台</text>
  <text x="106" y="282" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#4b5563">SDK + AgentOS runtime + control plane</text>
  <g transform="translate(104 340)">
    <rect width="300" height="170" rx="18" fill="#e9f5ff" stroke="#97c9ff"/>
    <text x="28" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0f3b66">Build</text>
    <text x="28" y="91" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">agents</text>
    <text x="28" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">teams</text>
    <text x="28" y="157" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">workflows</text>
  </g>
  <g transform="translate(490 340)">
    <rect width="300" height="170" rx="18" fill="#eef8ed" stroke="#9bd89a"/>
    <text x="28" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#245b2c">Run</text>
    <text x="28" y="91" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">API service</text>
    <text x="28" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">tracing</text>
    <text x="28" y="157" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">scheduling</text>
  </g>
  <g transform="translate(876 340)">
    <rect width="300" height="170" rx="18" fill="#fff4e5" stroke="#f5be6a"/>
    <text x="28" y="48" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#704100">Manage</text>
    <text x="28" y="91" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">sessions</text>
    <text x="28" y="124" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">memory</text>
    <text x="28" y="157" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#1f2937">approvals</text>
  </g>
  <text x="104" y="592" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#374151">GitHub: 40.6k stars · Apache-2.0 · Python · v2.6.13 / 2026-06-10</text>
</svg>
