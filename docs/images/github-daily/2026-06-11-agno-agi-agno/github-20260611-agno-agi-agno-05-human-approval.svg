<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Human approval flow</title>
  <desc id="desc">Agno human approval tiers for no approval, user approval, and admin approval.</desc>
  <rect width="1280" height="720" fill="#fffaf4"/>
  <text x="80" y="102" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#111827">敏感动作先停一下</text>
  <text x="82" y="150" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f4630">Agno 的 human approval 把工具调用分成三层</text>
  <g transform="translate(90 230)" font-family="Arial, Helvetica, sans-serif">
    <rect width="330" height="270" rx="24" fill="#ecfdf5" stroke="#86efac"/>
    <text x="32" y="60" font-size="30" font-weight="700" fill="#166534">No approval</text>
    <text x="32" y="118" font-size="22" fill="#1f2937">读文件</text>
    <text x="32" y="156" font-size="22" fill="#1f2937">搜索知识库</text>
    <text x="32" y="194" font-size="22" fill="#1f2937">查询数据库</text>
    <text x="32" y="232" font-size="22" fill="#1f2937">总结文档</text>
  </g>
  <g transform="translate(475 230)" font-family="Arial, Helvetica, sans-serif">
    <rect width="330" height="270" rx="24" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="32" y="60" font-size="30" font-weight="700" fill="#1d4ed8">User approval</text>
    <text x="32" y="118" font-size="22" fill="#1f2937">发邮件</text>
    <text x="32" y="156" font-size="22" fill="#1f2937">写文件</text>
    <text x="32" y="194" font-size="22" fill="#1f2937">跑 shell</text>
    <text x="32" y="232" font-size="22" fill="#1f2937">改业务记录</text>
  </g>
  <g transform="translate(860 230)" font-family="Arial, Helvetica, sans-serif">
    <rect width="330" height="270" rx="24" fill="#fdf2f8" stroke="#f9a8d4"/>
    <text x="32" y="60" font-size="30" font-weight="700" fill="#be185d">Admin approval</text>
    <text x="32" y="118" font-size="22" fill="#1f2937">退款</text>
    <text x="32" y="156" font-size="22" fill="#1f2937">授权</text>
    <text x="32" y="194" font-size="22" fill="#1f2937">部署生产</text>
    <text x="32" y="232" font-size="22" fill="#1f2937">删除客户数据</text>
  </g>
  <path d="M420 365 H475" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <path d="M805 365 H860" stroke="#9ca3af" stroke-width="6" stroke-linecap="round"/>
  <text x="90" y="604" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#4b5563">文档里把确认、审批、审计日志、暂停后恢复这些细节放在一起讲，适合真实业务系统。</text>
</svg>
