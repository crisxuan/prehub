<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7fbff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style><text x="64" y="86" font-size="40" font-weight="800" fill="#0f172a">RAG 管道</text><text x="66" y="126" font-size="22" fill="#64748b">从文档摄入到检索，再送给下游 LLM</text><rect x="76" y="172" width="1048" height="390" rx="22" fill="#fff" stroke="#dbe7f3"/><rect x="132" y="220" width="176" height="36" rx="18" fill="#e0f2fe"/><text x="154" y="244" font-size="17" font-weight="700" fill="#075985">PDF / PPT / DOC</text><rect x="328" y="220" width="130" height="36" rx="18" fill="#dcfce7"/><text x="350" y="244" font-size="17" font-weight="700" fill="#166534">Web Page</text><rect x="478" y="220" width="104" height="36" rx="18" fill="#fef3c7"/><text x="502" y="244" font-size="17" font-weight="700" fill="#92400e">Notion</text><rect x="602" y="220" width="190" height="36" rx="18" fill="#ede9fe"/><text x="624" y="244" font-size="17" font-weight="700" fill="#5b21b6">External Knowledge</text><rect x="132" y="304" width="154" height="86" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="176" y="356" font-size="21" font-weight="720" fill="#1d4ed8">Upload</text><rect x="354" y="304" width="154" height="86" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="392" y="356" font-size="21" font-weight="720" fill="#166534">Chunk</text><rect x="576" y="304" width="154" height="86" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="616" y="356" font-size="21" font-weight="720" fill="#9a3412">Index</text><rect x="798" y="304" width="154" height="86" rx="16" fill="#faf5ff" stroke="#d8b4fe"/><text x="824" y="356" font-size="21" font-weight="720" fill="#6b21a8">Retrieve</text><path d="M286 347 L354 347 M508 347 L576 347 M730 347 L798 347" stroke="#2563eb" stroke-width="4"/><text x="132" y="468" font-size="21" fill="#334155">知识库可以上传文件、同步网页或 Notion，再配置切块、索引和检索。</text><text x="132" y="508" font-size="21" fill="#334155">高质量模式支持向量检索、全文检索和混合检索。</text></svg>