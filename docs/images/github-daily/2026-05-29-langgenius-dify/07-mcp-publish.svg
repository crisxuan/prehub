<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7fbff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style><text x="64" y="86" font-size="40" font-weight="800" fill="#0f172a">发布成 MCP Server</text><text x="66" y="126" font-size="22" fill="#64748b">把 Dify 应用接到 Claude Desktop、Cursor 等客户端</text><rect x="82" y="170" width="1036" height="390" rx="22" fill="#fff" stroke="#dbe7f3"/><rect x="132" y="300" width="236" height="110" rx="18" fill="#eff6ff" stroke="#93c5fd"/><text x="184" y="350" font-size="28" font-weight="760" fill="#1d4ed8">Dify App</text><text x="174" y="384" font-size="18" fill="#475569">Workflow / Agent</text><rect x="482" y="278" width="236" height="154" rx="18" fill="#faf5ff" stroke="#d8b4fe"/><text x="520" y="334" font-size="26" font-weight="760" fill="#6b21a8">MCP Server URL</text><text x="522" y="374" font-size="17" fill="#475569">带认证信息，需要像 API key 一样保管</text><rect x="832" y="238" width="210" height="70" rx="16" fill="#f0fdf4" stroke="#86efac"/><text x="884" y="283" font-size="23" font-weight="720" fill="#166534">Claude</text><rect x="832" y="342" width="210" height="70" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="894" y="387" font-size="23" font-weight="720" fill="#9a3412">Cursor</text><path d="M368 355 L482 355 M718 335 L832 273 M718 375 L832 377" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="132" y="508" font-size="20" fill="#334155">功能默认关闭，开启后生成唯一地址，外部工具可以像调用扩展一样调用 Dify 应用。</text></svg>