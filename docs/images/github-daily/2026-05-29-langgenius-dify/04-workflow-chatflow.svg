<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#f7fbff"/><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}</style><text x="64" y="86" font-size="40" font-weight="800" fill="#0f172a">Workflow 和 Chatflow</text><text x="66" y="126" font-size="22" fill="#64748b">同一套画布，两种交互方式</text><rect x="78" y="166" width="492" height="410" rx="22" fill="#fff" stroke="#bfdbfe"/><text x="118" y="230" font-size="34" font-weight="780" fill="#1d4ed8">Workflow</text><text x="118" y="272" font-size="21" fill="#475569">一次性流程，适合批处理和报告生成</text><rect x="130" y="324" width="160" height="66" rx="14" fill="#eff6ff" stroke="#93c5fd"/><text x="168" y="365" font-size="20" font-weight="700" fill="#1d4ed8">Input</text><rect x="350" y="324" width="160" height="66" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="386" y="365" font-size="20" font-weight="700" fill="#166534">Process</text><rect x="240" y="452" width="160" height="66" rx="14" fill="#fff7ed" stroke="#fdba74"/><text x="282" y="493" font-size="20" font-weight="700" fill="#9a3412">Output</text><path d="M290 357 L350 357 M430 390 L320 452" stroke="#2563eb" stroke-width="4" fill="none"/><rect x="630" y="166" width="492" height="410" rx="22" fill="#fff" stroke="#c4b5fd"/><text x="670" y="230" font-size="34" font-weight="780" fill="#6d28d9">Chatflow</text><text x="670" y="272" font-size="21" fill="#475569">带聊天入口的结构化流程</text><rect x="682" y="324" width="160" height="66" rx="14" fill="#faf5ff" stroke="#d8b4fe"/><text x="714" y="365" font-size="20" font-weight="700" fill="#6b21a8">Message</text><rect x="902" y="324" width="160" height="66" rx="14" fill="#f0fdf4" stroke="#86efac"/><text x="944" y="365" font-size="20" font-weight="700" fill="#166534">Flow</text><rect x="792" y="452" width="160" height="66" rx="14" fill="#ecfeff" stroke="#67e8f9"/><text x="829" y="493" font-size="20" font-weight="700" fill="#0e7490">Answer</text><path d="M842 357 L902 357 M982 390 L872 452" stroke="#7c3aed" stroke-width="4" fill="none"/></svg>