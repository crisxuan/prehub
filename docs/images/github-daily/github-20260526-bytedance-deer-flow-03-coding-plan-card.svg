<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <text x="72" y="96" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">Recommended model direction</text>
  <text x="74" y="146" fill="#5c6470" font-family="Arial, Helvetica, sans-serif" font-size="25">DeerFlow is model-agnostic, but long tasks need stronger model capabilities.</text>
  <rect x="80" y="210" width="1440" height="570" rx="24" fill="#ffffff" stroke="#d8dee9" stroke-width="3"/>
  <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="2">
    <rect x="125" y="275" width="420" height="170" rx="18"/>
    <rect x="580" y="275" width="420" height="170" rx="18"/>
    <rect x="1035" y="275" width="420" height="170" rx="18"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="160" y="335" fill="#111827" font-size="32" font-weight="700">Doubao-Seed-2.0-Code</text>
    <text x="160" y="386" fill="#475569" font-size="24">coding and agent tasks</text>
    <text x="615" y="335" fill="#111827" font-size="32" font-weight="700">DeepSeek v3.2</text>
    <text x="615" y="386" fill="#475569" font-size="24">reasoning and tool use</text>
    <text x="1070" y="335" fill="#111827" font-size="32" font-weight="700">Kimi 2.5</text>
    <text x="1070" y="386" fill="#475569" font-size="24">long context work</text>
  </g>
  <text x="125" y="535" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">What DeerFlow asks the model to handle</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#334155">
    <text x="145" y="602">1. Keep context across long-running tasks</text>
    <text x="145" y="654">2. Call tools reliably and recover from failures</text>
    <text x="145" y="706">3. Read files, write outputs, and summarize structured results</text>
  </g>
  <rect x="930" y="548" width="380" height="68" rx="16" fill="#dbeafe"/>
  <text x="965" y="592" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">long context</text>
  <rect x="930" y="642" width="380" height="68" rx="16" fill="#dcfce7"/>
  <text x="965" y="686" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">tool calling</text>
  <rect x="930" y="736" width="380" height="68" rx="16" fill="#fef3c7"/>
  <text x="965" y="780" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">multimodal input</text>
  <text x="70" y="850" fill="#5c6470" font-family="Arial, Helvetica, sans-serif" font-size="26">Self-contained replacement for an expired README attachment.</text>
