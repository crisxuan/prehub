openapi: 3.1.0
info:
  title: PreHub Internal API
  version: 0.1.0
servers:
  - url: http://localhost:8080/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /daily-picks/today:
    get:
      operationId: getTodayPick
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecommendationCategory"
      responses:
        "200":
          description: Today daily pick
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPick"
  /daily-picks/recent:
    get:
      operationId: listRecentDailyPicks
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 31
            default: 7
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecommendationCategory"
      responses:
        "200":
          description: Recent daily picks, including today's automatic pick when it has not been manually published yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyPickHistory"
        "400":
          description: Invalid days window
  /search:
    get:
      operationId: searchRepositories
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
        - name: freshness
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
  /repositories/{owner}/{repo}:
    get:
      operationId: getRepository
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Repository detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
        "404":
          description: Repository not found
  /radar/overview:
    get:
      operationId: getRadarOverview
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecommendationCategory"
        - name: window
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RadarWindow"
      responses:
        "200":
          description: Radar overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarOverview"
  /radar/trending:
    get:
      operationId: listRadarTrending
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RecommendationCategory"
        - name: window
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RadarWindow"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: potential
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Radar trending repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RadarTrendItem"
                required:
                  - items
  /radar/repositories/{owner}/{repo}/metrics:
    get:
      operationId: getRadarRepositoryMetrics
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: window
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RadarWindow"
      responses:
        "200":
          description: Repository metric snapshots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarMetricsResponse"
        "404":
          description: Repository not found
  /feedback:
    post:
      operationId: createFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "202":
          description: Feedback accepted
  /admin/candidates:
    get:
      operationId: listCandidates
      responses:
        "200":
          description: Candidate queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                required:
                  - candidates
  /admin/candidates/{candidateId}/approve:
    post:
      operationId: approveCandidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Candidate approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  candidate:
                    $ref: "#/components/schemas/Candidate"
                required:
                  - status
                  - candidate
        "404":
          description: Candidate not found
  /admin/candidates/{candidateId}/publish:
    post:
      operationId: publishCandidate
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishCandidateInput"
      responses:
        "200":
          description: Candidate published as daily pick
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  dailyPick:
                    $ref: "#/components/schemas/DailyPick"
                required:
                  - status
                  - dailyPick
        "400":
          description: Candidate cannot be published
  /admin/overview:
    get:
      operationId: getAdminOverview
      responses:
        "200":
          description: Admin overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/repositories/submit:
    post:
      operationId: submitRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRepositoryInput"
      responses:
        "202":
          description: Repository submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitRepositoryResponse"
        "400":
          description: Invalid repository URL
        "502":
          description: GitHub API failed
  /admin/recrawl:
    post:
      operationId: recrawlRepositories
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                category:
                  $ref: "#/components/schemas/RecommendationCategory"
                perPage:
                  type: integer
                  minimum: 1
                  maximum: 100
      responses:
        "202":
          description: Recrawl accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  query:
                    type: string
                  queries:
                    type: array
                    items:
                      type: string
                  candidates:
                    type: array
                    items:
                      $ref: "#/components/schemas/Candidate"
                  rateLimit:
                    $ref: "#/components/schemas/RateLimitSnapshot"
                required:
                  - status
                  - query
                  - candidates
  /admin/radar/watchlist:
    post:
      operationId: addRadarWatchlistRepository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddWatchlistInput"
      responses:
        "202":
          description: Repository added to Radar watchlist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddWatchlistResponse"
        "400":
          description: Invalid repository URL
        "502":
          description: GitHub API failed
  /admin/radar/backfill:
    post:
      operationId: backfillRadarTrends
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RadarBackfillInput"
      responses:
        "202":
          description: Radar trend backfill accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarBackfillResponse"
        "502":
          description: External trend source failed
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        service:
          type: string
        status:
          type: string
        version:
          type: string
      required:
        - service
        - status
        - version
    Repository:
      type: object
      properties:
        fullName:
          type: string
        owner:
          type: string
        name:
          type: string
        htmlUrl:
          type: string
          format: uri
        avatarUrl:
          type: string
        description:
          type: string
        language:
          type: string
        stars:
          type: integer
        forks:
          type: integer
        license:
          type: string
        pushedAt:
          type: string
          format: date-time
        topics:
          type: array
          items:
            type: string
        reason:
          type: string
        caveat:
          type: string
        summary:
          type: string
      required:
        - fullName
        - owner
        - name
        - htmlUrl
        - description
        - language
        - stars
        - forks
        - license
        - pushedAt
        - topics
        - reason
        - caveat
        - summary
    DailyPick:
      type: object
      properties:
        date:
          type: string
          format: date
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        theme:
          type: string
        primary:
          $ref: "#/components/schemas/Repository"
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
      required:
        - date
        - category
        - theme
        - primary
        - alternatives
    DailyPickHistory:
      type: object
      properties:
        fromDate:
          type: string
          format: date
        toDate:
          type: string
          format: date
        days:
          type: integer
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        picks:
          type: array
          items:
            $ref: "#/components/schemas/DailyPick"
      required:
        - fromDate
        - toDate
        - days
        - category
        - picks
    SearchResponse:
      type: object
      properties:
        query:
          type: string
        intent:
          type: array
          items:
            type: string
        results:
          type: array
          items:
            $ref: "#/components/schemas/Repository"
      required:
        - query
        - intent
        - results
    FeedbackInput:
      type: object
      properties:
        repositoryFullName:
          type: string
        action:
          type: string
        context:
          type: string
      required:
        - repositoryFullName
        - action
    Candidate:
      type: object
      properties:
        id:
          type: string
        repository:
          $ref: "#/components/schemas/Repository"
        status:
          type: string
        qualityScore:
          type: integer
        source:
          type: string
        score:
          $ref: "#/components/schemas/ScoreBreakdown"
      required:
        - id
        - repository
        - status
        - qualityScore
    ScoreBreakdown:
      type: object
      properties:
        quality:
          type: integer
        popularity:
          type: integer
        freshness:
          type: integer
        momentum:
          type: integer
        documentation:
          type: integer
        maintenance:
          type: integer
        community:
          type: integer
        license:
          type: integer
        novelty:
          type: integer
      required:
        - quality
        - popularity
        - freshness
        - momentum
        - documentation
        - maintenance
        - community
        - license
        - novelty
    AdminOverview:
      type: object
      properties:
        candidateCount:
          type: integer
        pendingReviewCount:
          type: integer
        scheduledPickCount:
          type: integer
        lastRateLimitStatus:
          type: string
      required:
        - candidateCount
        - pendingReviewCount
        - scheduledPickCount
        - lastRateLimitStatus
    SubmitRepositoryInput:
      type: object
      properties:
        url:
          type: string
        source:
          type: string
        priority:
          type: string
      required:
        - url
    SubmitRepositoryResponse:
      type: object
      properties:
        status:
          type: string
        candidate:
          $ref: "#/components/schemas/Candidate"
        message:
          type: string
        rateLimit:
          $ref: "#/components/schemas/RateLimitSnapshot"
      required:
        - status
    PublishCandidateInput:
      type: object
      properties:
        date:
          type: string
          format: date
        theme:
          type: string
        category:
          $ref: "#/components/schemas/RecommendationCategory"
    RadarWindow:
      type: string
      enum:
        - 1h
        - 24h
        - 7d
        - 30d
        - 90d
    RadarAPIHealth:
      type: object
      properties:
        status:
          type: string
        remaining:
          type: string
        resetAt:
          type: string
      required:
        - status
    RadarOverview:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        window:
          $ref: "#/components/schemas/RadarWindow"
        monitoredCount:
          type: integer
        starDelta:
          type: integer
        candidateCount:
          type: integer
        apiHealth:
          $ref: "#/components/schemas/RadarAPIHealth"
        dataCoverage:
          $ref: "#/components/schemas/RadarDataCoverage"
        topTrending:
          type: array
          items:
            $ref: "#/components/schemas/RadarTrendItem"
        topPotential:
          type: array
          items:
            $ref: "#/components/schemas/RadarTrendItem"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/RadarEvent"
      required:
        - category
        - window
        - monitoredCount
        - starDelta
        - candidateCount
        - apiHealth
        - dataCoverage
        - topTrending
        - topPotential
        - recentEvents
    RadarDataCoverage:
      type: object
      properties:
        complete:
          type: boolean
        observedSince:
          type: string
          format: date-time
        observedUntil:
          type: string
          format: date-time
        windowStartedAt:
          type: string
          format: date-time
      required:
        - complete
        - observedSince
        - observedUntil
        - windowStartedAt
    RadarTrendItem:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/Repository"
        window:
          $ref: "#/components/schemas/RadarWindow"
        starDelta:
          type: integer
        forkDelta:
          type: integer
        issueDelta:
          type: integer
        activityEvents:
          type: integer
        velocityScore:
          type: number
        accelerationScore:
          type: number
        trendScore:
          type: number
        explanation:
          type: string
        dataCoverage:
          $ref: "#/components/schemas/RadarDataCoverage"
      required:
        - repository
        - window
        - starDelta
        - forkDelta
        - issueDelta
        - activityEvents
        - velocityScore
        - accelerationScore
        - trendScore
        - explanation
        - dataCoverage
    RadarEvent:
      type: object
      properties:
        repositoryFullName:
          type: string
        eventType:
          type: string
        actorLogin:
          type: string
        actorAvatarUrl:
          type: string
        occurredAt:
          type: string
          format: date-time
      required:
        - repositoryFullName
        - eventType
        - occurredAt
    RadarMetricPoint:
      type: object
      properties:
        capturedAt:
          type: string
          format: date-time
        stars:
          type: integer
        forks:
          type: integer
        openIssues:
          type: integer
      required:
        - capturedAt
        - stars
        - forks
        - openIssues
    RadarMetricSummary:
      type: object
      properties:
        starDelta:
          type: integer
        forkDelta:
          type: integer
        activityEvents:
          type: integer
      required:
        - starDelta
        - forkDelta
        - activityEvents
    RadarMetricsResponse:
      type: object
      properties:
        repository:
          $ref: "#/components/schemas/Repository"
        window:
          $ref: "#/components/schemas/RadarWindow"
        points:
          type: array
          items:
            $ref: "#/components/schemas/RadarMetricPoint"
        summary:
          $ref: "#/components/schemas/RadarMetricSummary"
        dataCoverage:
          $ref: "#/components/schemas/RadarDataCoverage"
      required:
        - repository
        - window
        - points
        - summary
        - dataCoverage
    AddWatchlistInput:
      type: object
      properties:
        url:
          type: string
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        tier:
          type: string
          enum:
            - hot
            - watch
            - candidate
            - archive
      required:
        - url
    AddWatchlistResponse:
      type: object
      properties:
        status:
          type: string
        repository:
          $ref: "#/components/schemas/Repository"
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        tier:
          type: string
      required:
        - status
        - repository
        - category
        - tier
    RadarBackfillInput:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        windows:
          type: array
          items:
            $ref: "#/components/schemas/RadarWindow"
        limit:
          type: integer
          minimum: 1
        batchSize:
          type: integer
          minimum: 1
          maximum: 1000
    RadarBackfillWindowResult:
      type: object
      properties:
        window:
          $ref: "#/components/schemas/RadarWindow"
        repositoryCount:
          type: integer
        matchedCount:
          type: integer
        starDelta:
          type: integer
        activityEvents:
          type: integer
        windowStartedAt:
          type: string
          format: date-time
        windowEndedAt:
          type: string
          format: date-time
      required:
        - window
        - repositoryCount
        - matchedCount
        - starDelta
        - activityEvents
        - windowStartedAt
        - windowEndedAt
    RadarBackfillResponse:
      type: object
      properties:
        status:
          type: string
        source:
          type: string
        category:
          $ref: "#/components/schemas/RecommendationCategory"
        results:
          type: array
          items:
            $ref: "#/components/schemas/RadarBackfillWindowResult"
      required:
        - status
        - source
        - category
        - results
    RecommendationCategory:
      type: string
      enum:
        - all
        - ai
        - ai-image
        - ai-prompts
        - ai-skills
        - web
        - devtools
        - data
        - backend
    RateLimitSnapshot:
      type: object
      properties:
        Limit:
          type: string
        Remaining:
          type: string
        Reset:
          type: string
        Resource:
          type: string
